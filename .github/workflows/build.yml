name: Build Podium Extra
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # This step ensures we use a compatible Gradle version
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9

      - name: Build Mod
        run: gradle build # Note: removed './gradlew' to use the version we just set up

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Podium-Extra-Jar
          path: build/libs/*.jar
