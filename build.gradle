plugins {
    id 'fabric-loom' version '1.7.4'
}

version = "1.1.0"
group = "com.podium-extra"

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    mavenCentral()
}

dependencies {
    // We use 1.16.5 so the compiler allows us to target Java 8/17.
    // The mod will still work on 1.21+ because it only uses Fabric Loader.
    minecraft "com.mojang:minecraft:1.16.5" 
    mappings "net.fabricmc:yarn:1.16.5+build.1:v2"
    modImplementation "net.fabricmc:fabric-loader:0.15.11"
}

java {
    // This tells Gradle to use Java 21 for the build process
    // but produce a JAR that works on Java 8+.
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 8
}
